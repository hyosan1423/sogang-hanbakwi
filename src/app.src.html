<title>서강 한 바퀴</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root {
  --outer: #E9EBEE; --bg: #FFFFFF; --ink: #1B1D21; --ink2: #3A3F47; --muted: #6B7280; --line: #ECEDF0; --line2: #D9DCE1;
  --soft: #F2F3F5; --soft2: #F7F8F9; --accent: #D2352B; --accent-ink: #B02A20; --accent-weak: #FCEBE9; --on-accent: #FFFFFF;
  --bar: #E8EDFB; --bar-ink: #2447B5; --warn: #FBF1D6; --warn-ink: #7A5A00; --inv: #1B1D21; --on-inv: #FFFFFF;
  --banner: #D2352B; --on-banner: #FFFFFF; --cafe: #B7791F;
  --dim: #9AA1AC; --scrim: rgba(16,18,22,.5); --shadow: 0 2px 10px rgba(16,18,22,.16); --map: #EEF1F3; --ring: #C9CFD6; --pin-line: #6B7280;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --outer: #0B0C0E; --bg: #121316; --ink: #ECEDEF; --ink2: #C5C8CE; --muted: #9AA1AC; --line: #23262B; --line2: #343840;
    --soft: #1C1E23; --soft2: #17191D; --accent: #FF6B5F; --accent-ink: #FF9A91; --accent-weak: #3A1B19; --on-accent: #1B0C0A;
    --bar: #1E2742; --bar-ink: #9DB4FF; --warn: #3A2F10; --warn-ink: #F2C85B; --inv: #ECEDEF; --on-inv: #121316;
    --banner: #B3261E; --on-banner: #FFFFFF; --cafe: #F2C85B;
    --dim: #6B7280; --scrim: rgba(0,0,0,.65); --shadow: 0 2px 10px rgba(0,0,0,.5); --map: #181B1F; --ring: #353A42; --pin-line: #9AA1AC;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --outer: #0B0C0E; --bg: #121316; --ink: #ECEDEF; --ink2: #C5C8CE; --muted: #9AA1AC; --line: #23262B; --line2: #343840;
  --soft: #1C1E23; --soft2: #17191D; --accent: #FF6B5F; --accent-ink: #FF9A91; --accent-weak: #3A1B19; --on-accent: #1B0C0A;
  --bar: #1E2742; --bar-ink: #9DB4FF; --warn: #3A2F10; --warn-ink: #F2C85B; --inv: #ECEDEF; --on-inv: #121316;
  --banner: #B3261E; --on-banner: #FFFFFF; --cafe: #F2C85B;
    --dim: #6B7280; --scrim: rgba(0,0,0,.65); --shadow: 0 2px 10px rgba(0,0,0,.5); --map: #181B1F; --ring: #353A42; --pin-line: #9AA1AC;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--outer); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; word-break: keep-all; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#app { max-width: 480px; min-height: 100vh; margin: 0 auto; background: var(--bg); position: relative; padding-bottom: 88px; }
.view { display: flex; flex-direction: column; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.pad { padding-inline: 16px; }

/* 공통 부품 */
.chip { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; border-radius: 4px; padding: 2px 6px; background: var(--soft); color: var(--ink2); white-space: nowrap; }
.chip.bar { background: var(--bar); color: var(--bar-ink); }
.chip.warn { background: var(--warn); color: var(--warn-ink); }
.pill { flex: none; font: 600 12px var(--font); background: var(--soft); border-radius: 999px; padding: 5px 9px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.pill .mono { font-family: var(--mono); }
.pill.off { color: var(--muted); background: var(--line); }
.pill.unk { color: var(--muted); background: transparent; border: 1px dashed var(--line2); }
.pbtn { min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid var(--line2); background: var(--bg); color: var(--ink); font-size: 14px; font-weight: 500; }
.pbtn[aria-pressed="true"], .pbtn.on { border: 2px solid var(--accent); background: var(--accent-weak); color: var(--accent-ink); font-weight: 700; padding: 0 15px; }
.pbtn.zero { border-style: dashed; color: var(--muted); }
.cta { min-height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 12px; border: 0; background: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 700; width: 100%; }
.ghost { min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--line2); background: var(--bg); font-size: 14px; font-weight: 600; }
.sec-title { font-size: 15px; font-weight: 700; }
.muted { color: var(--muted); }
.ibtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.empty { margin: 16px; padding: 28px 16px; border: 1px solid var(--line); border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.empty .t { font-size: 16px; font-weight: 700; }
.empty .s { font-size: 13px; color: var(--muted); }
.empty .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.empty .acts .pbtn.primary { background: var(--accent); color: var(--on-accent); border: 0; font-weight: 600; }

/* 하단 탭 */
.tabbar { position: fixed; z-index: 5; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: calc(64px + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); border-top: 1px solid var(--line); display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.tabbar button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-size: 11px; font-weight: 500; }
.tabbar button[aria-current="page"] { color: var(--accent); font-weight: 600; }

/* 홈 */
.home-head { padding: 20px 16px 4px; display: flex; flex-direction: column; gap: 2px; }
.brand { font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
.brand-sub { font-size: 13px; color: var(--muted); }
.fakeinput { margin: 12px 16px 0; height: 48px; width: calc(100% - 32px); display: flex; align-items: center; gap: 10px; padding: 0 16px; background: var(--soft); border: 0; border-radius: 24px; color: var(--muted); font-size: 15px; text-align: left; }
.banner { margin: 12px 16px 0; min-height: 64px; width: calc(100% - 32px); border: 0; border-radius: 14px; background: var(--banner); color: var(--on-banner); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; text-align: left; }
.banner b { font-size: 16px; display: block; }
.banner span.s { font-size: 12px; opacity: .9; }
.banner .cnt { font: 700 24px var(--font); font-variant-numeric: tabular-nums; white-space: nowrap; }
.banner .cnt small { font-size: 14px; font-weight: 600; margin-left: 2px; }
.block { padding: 22px 16px 0; display: flex; flex-direction: column; gap: 10px; }
.situ { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 8px; }
.situ button { grid-column: span 3; min-height: 76px; border: 0; border-radius: 14px; background: var(--soft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 600; padding: 6px 2px; }
.situ button.w4 { grid-column: span 4; }
.situ button small { font-size: 11px; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.kwg { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .02em; margin-top: 6px; }
.pbtn.kw { min-height: 38px; padding: 0 12px; font-size: 14px; }
.pbtn.kw small { color: var(--muted); font-size: 12px; margin-left: 2px; }
.sec-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sec-row button { border: 0; background: transparent; color: var(--accent-ink); font-size: 13px; font-weight: 600; min-height: 44px; padding: 0 2px; }
.notice { margin: 22px 16px 0; padding: 12px 14px; border-radius: 12px; background: var(--soft); font-size: 13px; color: var(--ink2); line-height: 1.55; }

/* 목록 */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; background: var(--bg); padding: 8px 8px 8px 4px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--line); }
.topbar .search { flex: 1; min-width: 0; height: 44px; border-radius: 22px; border: 0; background: var(--soft); padding: 0 16px; font-size: 15px; }
.fbtn { flex: none; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--line2); background: var(--bg); font-size: 14px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.fbtn.on { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-weak); }
/* 분류 대기 정리 */
.trimsg { margin: 8px 16px 0; padding: 10px 12px; border-radius: 12px; background: var(--accent-weak); color: var(--accent-ink); font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.trimsg.err { background: var(--bg2, var(--accent-weak)); color: var(--danger, var(--accent-ink)); }
.trimsg button { border: 0; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; min-height: 36px; }
.tri { display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 24px; }
.tricard { border: 1px solid var(--line2); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.tritop { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; min-width: 0; }
.tritop b { font-size: 16px; }
.trimeta { font-size: 12px; color: var(--muted); }
.triinfo { font-size: 12px; color: var(--muted); line-height: 1.45; overflow-wrap: anywhere; }
.trichips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.pbtn.tri { min-height: 40px; padding: 0 12px; font-size: 14px; display: inline-flex; align-items: center; text-decoration: none; }
.pbtn.tri.map { color: var(--muted); border-style: dashed; }
.sumline { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px 4px; }
.sumline .l { font-size: 14px; font-weight: 700; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 18px; overflow: hidden; }
.seg button { min-height: 36px; padding: 0 12px; border: 0; background: transparent; font-size: 13px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--inv); color: var(--on-inv); font-weight: 600; }
.activef { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 16px 0; }
.activef button { min-height: 32px; border: 0; border-radius: 16px; background: var(--accent-weak); color: var(--accent-ink); font-size: 12px; font-weight: 600; padding: 0 10px; }
.rows { display: flex; flex-direction: column; padding: 8px 16px 0; gap: 8px; }
.row { cursor: pointer; width: 100%; display: flex; gap: 12px; align-items: center; padding: 12px; border: 0; border-radius: 14px; background: transparent; text-align: left; border: 1px solid var(--line); }
.row.pend { border: 1px dashed var(--dim); }
.row.off { background: var(--soft2); border-color: transparent; }
.row .tile { flex: none; width: 64px; height: 64px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; background: var(--soft); color: var(--ink2); text-align: center; line-height: 1.2; padding: 4px; }
.row .tile.bar { background: var(--bar); color: var(--bar-ink); }
.row .tile.warn { background: var(--warn); color: var(--warn-ink); }
.row .tile.inv { background: var(--inv); color: var(--on-inv); font: 600 15px var(--mono); }
.row .tile.off { background: var(--line); color: var(--muted); }
.side { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.favbtn { width: 40px; height: 34px; border: 0; border-radius: 17px; background: transparent; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; }
.favbtn[aria-pressed="true"] { color: var(--accent); }
.favbtn.top { position: absolute; right: 8px; top: 8px; width: 44px; height: 44px; border-radius: 50%; background: var(--bg); box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.row .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.row .nm { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.row .nm b { font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
.row .meta { font-size: 12px; color: var(--muted); }
.row .tags { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row.off .nm b { color: var(--muted); }

/* 시트 */
.scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; justify-content: center; align-items: flex-end; }
.sheet { width: 100%; max-width: 480px; height: calc(100% - 72px); background: var(--bg); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; overflow: hidden; }
.sheet .grab { height: 22px; display: flex; align-items: center; justify-content: center; flex: none; }
.sheet .grab i { width: 40px; height: 4px; border-radius: 2px; background: var(--line2); }
.sheet .hd { padding: 0 16px; min-height: 44px; display: flex; align-items: center; justify-content: space-between; flex: none; }
.sheet .hd b { font-size: 18px; }
.sheet .hd button { border: 0; background: transparent; min-height: 44px; padding: 0 4px; font-size: 14px; color: var(--muted); }
.sheet .scr { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 12px; }
.sheet .ft { flex: none; padding: 12px 16px calc(20px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.grid3 .pbtn { border-radius: 10px; padding: 0 4px; }
.toggle { margin: 22px 16px 0; min-height: 56px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); }
.sw { position: relative; width: 50px; height: 30px; border-radius: 15px; background: var(--line2); border: 0; padding: 0; }
.sw i { position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
.sw[aria-checked="true"] { background: var(--accent); }
.sw[aria-checked="true"] i { transform: translateX(20px); }
.hint { font-size: 12px; color: var(--muted); }

/* 지도 */
.mapchips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px 0; scrollbar-width: none; background: var(--bg); }
.mapchips::-webkit-scrollbar { display: none; }
.mapchips .pbtn { flex: none; }
.locbar { display: flex; gap: 8px; padding: 12px 16px 0; flex-wrap: wrap; }
.locbar .pbtn.primary { background: var(--accent); color: var(--on-accent); border: 0; font-weight: 700; }
.nearmsg { margin: 10px 16px 0; padding: 8px 12px; border-radius: 10px; background: var(--inv); color: var(--on-inv); font-size: 12px; line-height: 1.5; }
.nearhint { margin: 10px 16px 0; font-size: 12px; color: var(--muted); line-height: 1.5; }

/* 상세 */
.hero { height: 180px; background: var(--soft); position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0 56px; text-align: center; }
.hero .k { font-size: 30px; font-weight: 700; letter-spacing: -.02em; color: var(--ink2); }
.hero .s { font-size: 12px; color: var(--muted); }
.dtop { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; background: var(--bg); display: flex; align-items: center; padding: 6px 8px; }
.dtop .sp { flex: 1; }
.dtop .back { position: static; box-shadow: none; background: transparent; }
.dtop .favbtn.top { position: static; box-shadow: none; background: transparent; }
.back { position: absolute; left: 8px; top: 8px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.dhead { padding: 18px 16px 0; display: flex; flex-direction: column; gap: 8px; }
.dhead h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; overflow-wrap: anywhere; }
.dhead .chips { gap: 6px; }
.facts { padding: 14px 16px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fact { background: var(--soft); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fact span { font-size: 12px; color: var(--muted); }
.fact b { font: 600 20px var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.fact.inv { background: var(--inv); color: var(--on-inv); }
.fact.inv span { color: var(--on-inv); opacity: .8; }
.fact b.k { font: 700 18px var(--font); }
.fact .sub { font-size: 11px; color: var(--muted); }
.fact b.sm { font: 600 15px var(--font); }
.tagline { padding: 14px 16px 0; display: flex; flex-wrap: wrap; gap: 6px; }
.tagline span { font-size: 13px; color: var(--ink2); background: var(--soft); border-radius: 999px; padding: 7px 12px; }
.info { margin: 18px 16px 0; border-top: 1px solid var(--line); }
.info .r { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.info .r > span:first-child { flex: none; width: 56px; font-size: 13px; color: var(--muted); }
.info .r .v { font-size: 14px; display: flex; flex-direction: column; gap: 3px; min-width: 0; font-variant-numeric: tabular-nums; }
.info .r .v .today { font-weight: 700; }
.anchors { padding: 20px 16px 0; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.anchors::-webkit-scrollbar { display: none; }
.anchors button { flex: none; min-height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: var(--soft); font-size: 14px; font-weight: 500; }
.anchors button.on { background: var(--inv); color: var(--on-inv); font-weight: 600; }
.msec { padding: 14px 16px 0; scroll-margin-top: 8px; }
.msec h3 { font-size: 16px; font-weight: 700; padding-bottom: 6px; }
.mi { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 42px; border-top: 1px solid var(--line); font-size: 14px; }
.mi span:first-child { overflow-wrap: anywhere; min-width: 0; }
.mi .pr { flex: none; font: 600 14px var(--mono); font-variant-numeric: tabular-nums; }
.nomenu { margin: 20px 16px 0; padding: 20px 16px; border-radius: 14px; background: var(--soft); display: flex; flex-direction: column; gap: 4px; }
.nomenu b { font-size: 16px; }
.nomenu p { font-size: 14px; line-height: 1.55; color: var(--ink2); }
.dfoot { padding: 18px 16px 0; font-size: 12px; color: var(--muted); }
.fixcta { position: fixed; z-index: 5; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); }
.editbtn { margin: 16px 16px 0; align-self: flex-start; }

/* 지도 요소 색 */

/* 소개 */
.about { padding: 20px 16px 0; display: flex; flex-direction: column; gap: 14px; }
.about h2 { font-size: 22px; font-weight: 700; }
.about p, .about li { font-size: 14px; line-height: 1.65; color: var(--ink2); }
.about ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }

/* 개발자 입력 */
.dev { padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.dev h2 { font-size: 18px; font-weight: 700; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field.wide { grid-column: 1 / -1; }
.lbl { font-size: 13px; font-weight: 500; color: var(--muted); }
.dev input[type="text"], .dev input[type="number"], .dev input[type="date"], .dev select, .dev textarea { min-height: 44px; padding: 8px 12px; background: var(--bg); border: 1px solid var(--line2); border-radius: 8px; width: 100%; min-width: 0; }
.kindset { border: 0; padding: 0; margin: 0; min-width: 0; }
.kindpick { display: flex; flex-wrap: wrap; gap: 8px; }
.kindpick label { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border: 1px solid var(--line2); border-radius: 999px; font-size: 14px; }
.kindpick input, .solo-pick input { width: 16px; height: 16px; accent-color: var(--accent); }
.solo-pick { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.secondary { background: transparent; color: var(--accent-ink); }
.btn.danger { background: transparent; border-color: var(--accent); color: var(--accent-ink); }

  // ---------- 렌더 ----------
